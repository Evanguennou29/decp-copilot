[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decp-copilot"
version = "0.0.1"
description = "Recherche augmentée sur les marchés publics français (DECP), avec évaluation chiffrée du retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Evan Guennou", email = "evan.guennou2@gmail.com" }]
dependencies = ["duckdb>=1.0,<2.0", "numpy>=1.26,<3.0", "sentence-transformers>=3.0,<4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
decp = "decp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/decp"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
